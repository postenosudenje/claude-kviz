[build]
  publish = "."

# Podaci: preglednik/CDN ih drži 5 min, zatim provjerava ima li novih
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Čiste adrese rade i kad "Pretty URLs" nisu uključeni u Netlifyju
[[redirects]]
  from = "/igra"
  to = "/igra.html"
  status = 200

[[redirects]]
  from = "/sudac/:ime"
  to = "/sudac/:ime.html"
  status = 200

[[redirects]]
  from = "/klub/:ime"
  to = "/klub/:ime.html"
  status = 200
